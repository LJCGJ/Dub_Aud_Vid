[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dub-engines"
version = "0.1.0"
description = "Engines de IA (transcrição, tradução, TTS, separação, diarização) para o dub"
authors = [{ name = "Leonardo Gonzaga" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Pacote recomendado para começar: roda em CPU, tudo offline.
basic = [
    "faster-whisper>=1.0",
    "torch>=2.1",
    "transformers>=4.40",
    "sentencepiece",
    "sacremoses",
    "piper-tts>=1.2",
]
kokoro = ["kokoro>=0.9", "soundfile"]
# Clonagem de voz (pesado, GPU recomendada).
clone = ["coqui-tts>=0.24"]
# Separação de voz/fundo.
separate = ["demucs>=4.0", "torchaudio"]
# Diarização (precisa de HF_TOKEN).
diarize = ["pyannote.audio>=3.1"]
# Download do YouTube.
youtube = ["yt-dlp"]
all = ["dub-engines[basic,kokoro,clone,separate,diarize,youtube]"]

[tool.setuptools.packages.find]
include = ["dub_engines*"]
