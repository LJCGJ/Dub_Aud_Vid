name: Models

# Converte modelos de tradução (Hugging Face → CTranslate2 int8) e publica os
# .tar.gz na release fixa `models-v1`, de onde `dub models download` baixa.
# Rode manualmente (workflow_dispatch) quando adicionar/atualizar um tradutor.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release de modelos"
        default: "models-v1"
        required: true

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hf: Helsinki-NLP/opus-mt-tc-big-en-pt
            name: opus-mt-tc-big-en-pt-ct2-int8
            prefix: ">>por_BR<<"
          - hf: Helsinki-NLP/opus-mt-en-ROMANCE
            name: opus-mt-en-ROMANCE-ct2-int8
            prefix: ">>pt_BR<<"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet ctranslate2 transformers sentencepiece sacremoses huggingface_hub
      - name: Converter
        run: |
          python scripts/convert_translator.py "${{ matrix.hf }}" \
            --name "${{ matrix.name }}" --target-prefix "${{ matrix.prefix }}" \
            --out dist --tar
          ls -la dist/*.tar.gz
          cd dist && sha256sum "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: convert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar na release de modelos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Modelos convertidos (${{ inputs.release_tag }})
          body: |
            Modelos de tradução convertidos para CTranslate2 (int8) pelo workflow `models.yml`.
            Instale com `dub models download <nome>`. Licenças: as dos modelos originais (CC-BY-4.0 / Apache-2.0, Helsinki-NLP).
          files: dist/*
          prerelease: true
