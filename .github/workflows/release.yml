name: Release

# Dispara ao criar uma tag v* (ex.: `git tag v0.1.0 && git push --tags`).
# Publica no GitHub Release:
#   - instalador do app de desktop (Windows .exe NSIS, macOS .dmg, Linux .deb/.AppImage)
#   - zip/tar da CLI por plataforma
# Ambos trazem onnxruntime + espeak-ng-data; o Windows traz também ffmpeg e yt-dlp,
# então não exige nenhuma instalação extra.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VULKAN_SDK_VERSION: "1.4.363.1"
  ORT_VERSION: "1.20.1"
  # whisper.cpp em modo portátil (AVX2) em vez de -march=native do runner.
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/native/cmake/ggml-portable.cmake
  # whisper.cpp usa std::filesystem (macOS 10.15+); Apple Silicon começa no 11.0.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # Vulkan: whisper em qualquer GPU (NVIDIA/AMD/Intel) sem CUDA instalado.
            # DirectML: voz (Piper) em qualquer GPU. Ambos caem para CPU se não houver GPU.
            features: native-vulkan,native-directml
            ort_asset: onnxruntime-win-x64-${ORT_VERSION}.zip
            ort_lib: lib/onnxruntime.dll
            ort_name: onnxruntime.dll
            exe: dub.exe
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: native-vulkan
            ort_asset: onnxruntime-linux-x64-${ORT_VERSION}.tgz
            ort_lib: lib/libonnxruntime.so.${ORT_VERSION}
            ort_name: libonnxruntime.so
            exe: dub
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            features: native-metal
            ort_asset: onnxruntime-osx-arm64-${ORT_VERSION}.tgz
            ort_lib: lib/libonnxruntime.${ORT_VERSION}.dylib
            ort_name: libonnxruntime.dylib
            exe: dub
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      # whisper.cpp com backend Vulkan precisa do SDK (headers + glslc) só na hora de
      # compilar; em tempo de execução basta o driver de vídeo do usuário.
      - name: Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        id: vulkan-cache-linux
        uses: actions/cache@v4
        with:
          path: ~/vulkan-sdk
          key: vulkan-sdk-linux-v2-${{ env.VULKAN_SDK_VERSION }}

      - name: Instalar Vulkan SDK (Linux)
        if: runner.os == 'Linux' && steps.vulkan-cache-linux.outputs.cache-hit != 'true'
        run: |
          # O Ubuntu 22.04 não tem glslc e os headers são antigos; o tarball da
          # LunarG (~350 MB) traz headers, loader e glslc. O pacote apt
          # 'vulkan-sdk' puxa Qt e leva 40 min — por isso o tarball.
          mkdir -p ~/vulkan-sdk && cd ~/vulkan-sdk
          curl -fsSL --retry 5 -o sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz"
          tar -xJf sdk.tar.xz --wildcards "*/x86_64/bin/glslc" "*/x86_64/include/*" "*/x86_64/lib/VulkanLoader/*" "*/x86_64/share/vulkan/*"
          rm sdk.tar.xz
          # Nesta versão o loader fica em lib/VulkanLoader/lib; o FindVulkan do
          # CMake procura em $VULKAN_SDK/lib.
          cp -a "${VULKAN_SDK_VERSION}/x86_64/lib/VulkanLoader/lib/." "${VULKAN_SDK_VERSION}/x86_64/lib/"

      - name: Variáveis do Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          SDK="$HOME/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64"
          echo "VULKAN_SDK=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$SDK/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          ls "$SDK/bin/glslc" "$SDK/include/vulkan/vulkan.h" "$SDK/lib/libvulkan.so"
          # O linker procura -lvulkan nos caminhos padrão; o whisper-rs-sys não
          # adiciona $VULKAN_SDK/lib no Linux.
          sudo cp -a "$SDK"/lib/libvulkan.so* /usr/local/lib/ && sudo ldconfig
          "$SDK/bin/glslc" --version | head -1

      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-windows-${{ env.VULKAN_SDK_VERSION }}

      - name: Instalar Vulkan SDK (Windows)
        if: runner.os == 'Windows' && steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Instalador oficial do LunarG em modo silencioso (mesmo método do CI do llama.cpp).
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/${env:VULKAN_SDK_VERSION}/windows/vulkan_sdk.exe" -OutFile vulkan_sdk.exe
          Start-Process -Wait -FilePath .\vulkan_sdk.exe -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install"
          Get-ChildItem C:\VulkanSDK | Select-Object Name

      - name: Variáveis do Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VULKAN_SDK=C:/VulkanSDK" >> "$GITHUB_ENV"
          echo "C:/VulkanSDK/Bin" >> "$GITHUB_PATH"
          ls C:/VulkanSDK/Include/vulkan/vulkan.h C:/VulkanSDK/Lib/vulkan-1.lib C:/VulkanSDK/Bin/glslc.exe

      # ---------- recursos compartilhados: onnxruntime, espeak-ng-data, (ffmpeg, yt-dlp) ----------
      - name: Baixar ONNX Runtime oficial
        shell: bash
        run: |
          set -e
          ASSET="${{ matrix.ort_asset }}"; ASSET="${ASSET//\$\{ORT_VERSION\}/$ORT_VERSION}"
          LIB="${{ matrix.ort_lib }}";     LIB="${LIB//\$\{ORT_VERSION\}/$ORT_VERSION}"
          curl -sSL -o ort_pkg "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ASSET}"
          mkdir -p ort_extract
          case "$ASSET" in *.zip) unzip -q ort_pkg -d ort_extract ;; *.tgz) tar -xzf ort_pkg -C ort_extract ;; esac
          FOUND=$(find ort_extract -path "*/$LIB" | head -1)
          test -n "$FOUND" || { echo "lib não encontrada: $LIB"; find ort_extract -maxdepth 3; exit 1; }
          mkdir -p resources
          cp "$FOUND" "resources/${{ matrix.ort_name }}"
          find ort_extract -name "*providers_shared*" -exec cp {} resources/ \; || true

      - name: espeak-ng-data (do pacote piper-tts)
        shell: bash
        run: |
          python -m pip install --quiet piper-tts
          DATA=$(python -c "import piper,os;print(os.path.join(os.path.dirname(piper.__file__),'espeak-ng-data'))")
          cp -r "$DATA" resources/espeak-ng-data
          test -f resources/espeak-ng-data/phontab

      - name: ONNX Runtime DirectML (Windows — voz em qualquer GPU)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          # Substitui a onnxruntime.dll de CPU pela variante DirectML, que usa a GPU quando
          # houver e cai para CPU sozinha quando não houver. DirectML.dll vai junto (a do
          # System32 pode ser antiga).
          curl -sSL -o ortdml.nupkg "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/${ORT_VERSION}"
          unzip -q -o ortdml.nupkg -d ortdml
          cp ortdml/runtimes/win-x64/native/onnxruntime.dll resources/onnxruntime.dll
          curl -sSL -o dml.nupkg "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4"
          unzip -q -o dml.nupkg -d dml
          cp dml/bin/x64-win/DirectML.dll resources/DirectML.dll
          cp dml/LICENSE.txt resources/LICENSE-DirectML.txt
          ls -la resources/*.dll

      - name: ffmpeg + yt-dlp (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          # BtbN às vezes responde HTML/429 em vez do zip: tenta de novo e, se
          # ainda falhar, usa o build do gyan.dev.
          fetch() { curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ff.zip "$1" && unzip -tq ff.zip >/dev/null; }
          fetch "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" \
            || fetch "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          unzip -q ff.zip -d ff
          cp ff/*/bin/ffmpeg.exe ff/*/bin/ffprobe.exe resources/
          cp ff/*/LICENSE.txt resources/LICENSE-ffmpeg.txt || true
          curl -sSL -o resources/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          ls -la resources

      # ---------- app de desktop (Tauri) ----------
      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Versão do app = versão da tag
        shell: bash
        run: |
          # A tag v0.1.1 manda: o instalador sai como Dub_0.1.1_… mesmo que
          # alguém esqueça de subir a versão no tauri.conf.json.
          VER="${GITHUB_REF_NAME#v}"
          python - "$VER" <<'PY'
          import json, sys
          p = "app/tauri.conf.json"
          c = json.load(open(p, encoding="utf-8"))
          print("tauri.conf.json:", c["version"], "->", sys.argv[1])
          c["version"] = sys.argv[1]
          json.dump(c, open(p, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          PY

      - name: Build do app (sem instalador)
        shell: bash
        run: |
          set -e
          mkdir -p target/bundle-resources
          cp -r resources/. target/bundle-resources/
          FEAT="${{ matrix.features }}"
          cd app
          if [ -n "$FEAT" ]; then
            tauri build --no-bundle --target ${{ matrix.target }} --features "$FEAT"
          else
            tauri build --no-bundle --target ${{ matrix.target }}
          fi

      - name: Build da CLI
        shell: bash
        run: |
          FEAT="${{ matrix.features }}"
          if [ -n "$FEAT" ]; then
            cargo build --release -p dub-cli --target ${{ matrix.target }} --features "$FEAT"
          else
            cargo build --release -p dub-cli --target ${{ matrix.target }}
          fi

      # ---------- assinatura dos executáveis (Windows, SignPath Foundation) ----------
      # Só roda quando o projeto estiver aprovado e as variáveis/segredos configurados;
      # até lá o estágio é pulado e a release sai sem assinatura.
      - name: Empacotar executáveis para assinatura
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          mkdir -p unsigned
          cp target/${{ matrix.target }}/release/dub-app.exe target/${{ matrix.target }}/release/dub.exe unsigned/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-exes
        with:
          name: unsigned-exes
          path: unsigned/*.exe
      - name: Assinar executáveis (SignPath)
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.unsigned-exes.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Usar executáveis assinados
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          cp signed/dub-app.exe target/${{ matrix.target }}/release/dub-app.exe
          cp signed/dub.exe     target/${{ matrix.target }}/release/dub.exe

      - name: Instalador
        shell: bash
        run: |
          set -e
          cd app && tauri bundle --target ${{ matrix.target }} && cd ..
          mkdir -p dist
          find target/${{ matrix.target }}/release/bundle -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist/ \;
          ls -la dist

      - name: Empacotar instalador para assinatura
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: mkdir -p unsigned-installer && cp dist/*-setup.exe unsigned-installer/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-installer
        with:
          name: unsigned-installer
          path: unsigned-installer/*.exe
      - name: Assinar instalador (SignPath)
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
      - name: Usar instalador assinado
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: cp signed-installer/*-setup.exe dist/

      # ---------- CLI (zip/tar) ----------
      - name: Pacote da CLI
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="dev-${GITHUB_SHA::7}"
          NAME="dub-cli-${VERSION}-${{ matrix.name }}"
          mkdir -p "$NAME"
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} "$NAME/"
          cp -r resources/. "$NAME/"
          cp -r py "$NAME/py"; rm -rf "$NAME/py/.venv"
          cp README.md LICENSE "$NAME/"
          cat > "$NAME/LEIA-ME.txt" <<EOF
          dub CLI ${VERSION} — ${{ matrix.name }}

          1. ./dub models download        (baixa whisper + voz + tradutor, ~1,8 GB)
          2. ./dub doctor
          3. ./dub video "URL ou arquivo.mp4"

          Prefere interface gráfica? Instale o Dub (instalador na mesma release).
          Engines Python (Kokoro, XTTS, Demucs, pyannote) são opcionais: veja py/README.md.
          EOF
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a -r "dist/${NAME}.zip" "$NAME" > /dev/null; else tar -czf "dist/${NAME}.tar.gz" "$NAME"; fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Instalação
            **Windows:** baixe `Dub_*_x64-setup.exe`, instale e abra o Dub. Na aba *Modelos*, clique em *Baixar conjunto padrão* (~1,8 GB, uma vez). Não precisa de Python, ffmpeg nem nada mais.
            **macOS:** `Dub_*_aarch64.dmg` (Apple Silicon). Instale o ffmpeg com `brew install ffmpeg`.
            **Linux:** `.deb` ou `.AppImage`; instale o `ffmpeg` pela sua distribuição.

            A CLI (`dub-cli-*`) está na mesma release para uso em scripts.
          draft: false
