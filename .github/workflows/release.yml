name: Release

# Dispara ao criar uma tag v* (ex.: `git tag v0.1.0 && git push --tags`).
# Publica no GitHub Release:
#   - instalador do app de desktop (Windows .exe NSIS, macOS .dmg, Linux .deb/.AppImage)
#   - zip/tar da CLI por plataforma
# Ambos trazem onnxruntime + espeak-ng-data; o Windows traz também ffmpeg e yt-dlp,
# então não exige nenhuma instalação extra.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: "1.20.1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: native-directml
            ort_asset: onnxruntime-win-x64-${ORT_VERSION}.zip
            ort_lib: lib/onnxruntime.dll
            ort_name: onnxruntime.dll
            exe: dub.exe
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: ""
            ort_asset: onnxruntime-linux-x64-${ORT_VERSION}.tgz
            ort_lib: lib/libonnxruntime.so.${ORT_VERSION}
            ort_name: libonnxruntime.so
            exe: dub
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            features: native-metal
            ort_asset: onnxruntime-osx-arm64-${ORT_VERSION}.tgz
            ort_lib: lib/libonnxruntime.${ORT_VERSION}.dylib
            ort_name: libonnxruntime.dylib
            exe: dub
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      # ---------- recursos compartilhados: onnxruntime, espeak-ng-data, (ffmpeg, yt-dlp) ----------
      - name: Baixar ONNX Runtime oficial
        shell: bash
        run: |
          set -e
          ASSET="${{ matrix.ort_asset }}"; ASSET="${ASSET//\$\{ORT_VERSION\}/$ORT_VERSION}"
          LIB="${{ matrix.ort_lib }}";     LIB="${LIB//\$\{ORT_VERSION\}/$ORT_VERSION}"
          curl -sSL -o ort_pkg "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ASSET}"
          mkdir -p ort_extract
          case "$ASSET" in *.zip) unzip -q ort_pkg -d ort_extract ;; *.tgz) tar -xzf ort_pkg -C ort_extract ;; esac
          FOUND=$(find ort_extract -path "*/$LIB" | head -1)
          test -n "$FOUND" || { echo "lib não encontrada: $LIB"; find ort_extract -maxdepth 3; exit 1; }
          mkdir -p resources
          cp "$FOUND" "resources/${{ matrix.ort_name }}"
          find ort_extract -name "*providers_shared*" -exec cp {} resources/ \; || true

      - name: espeak-ng-data (do pacote piper-tts)
        shell: bash
        run: |
          python -m pip install --quiet piper-tts
          DATA=$(python -c "import piper,os;print(os.path.join(os.path.dirname(piper.__file__),'espeak-ng-data'))")
          cp -r "$DATA" resources/espeak-ng-data
          test -f resources/espeak-ng-data/phontab

      - name: ffmpeg + yt-dlp (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          curl -sSL -o ff.zip "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          unzip -q ff.zip -d ff
          cp ff/*/bin/ffmpeg.exe ff/*/bin/ffprobe.exe resources/
          cp ff/*/LICENSE.txt resources/LICENSE-ffmpeg.txt || true
          curl -sSL -o resources/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          ls -la resources

      # ---------- app de desktop (Tauri) ----------
      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build do app + instalador
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
        run: |
          set -e
          mkdir -p target/bundle-resources
          cp -r resources/. target/bundle-resources/
          # pasta de modelos vazia no bundle: o app baixa para o cache do usuário
          FEAT="${{ matrix.features }}"
          cd app
          if [ -n "$FEAT" ]; then
            tauri build --target ${{ matrix.target }} --features "$FEAT"
          else
            tauri build --target ${{ matrix.target }}
          fi
          cd ..
          mkdir -p dist
          find target/${{ matrix.target }}/release/bundle -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist/ \;
          ls -la dist

      # ---------- CLI (zip/tar) ----------
      - name: Build da CLI
        shell: bash
        run: |
          FEAT="${{ matrix.features }}"
          if [ -n "$FEAT" ]; then
            cargo build --release -p dub-cli --target ${{ matrix.target }} --features "$FEAT"
          else
            cargo build --release -p dub-cli --target ${{ matrix.target }}
          fi

      - name: Pacote da CLI
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="dev-${GITHUB_SHA::7}"
          NAME="dub-cli-${VERSION}-${{ matrix.name }}"
          mkdir -p "$NAME"
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} "$NAME/"
          cp -r resources/. "$NAME/"
          cp -r py "$NAME/py"; rm -rf "$NAME/py/.venv"
          cp README.md LICENSE "$NAME/"
          cat > "$NAME/LEIA-ME.txt" <<EOF
          dub CLI ${VERSION} — ${{ matrix.name }}

          1. ./dub models download        (baixa whisper + voz + tradutor, ~1,8 GB)
          2. ./dub doctor
          3. ./dub video "URL ou arquivo.mp4"

          Prefere interface gráfica? Instale o Dub (instalador na mesma release).
          Engines Python (Kokoro, XTTS, Demucs, pyannote) são opcionais: veja py/README.md.
          EOF
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a -r "dist/${NAME}.zip" "$NAME" > /dev/null; else tar -czf "dist/${NAME}.tar.gz" "$NAME"; fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Instalação
            **Windows:** baixe `Dub_*_x64-setup.exe`, instale e abra o Dub. Na aba *Modelos*, clique em *Baixar conjunto padrão* (~1,8 GB, uma vez). Não precisa de Python, ffmpeg nem nada mais.
            **macOS:** `Dub_*_aarch64.dmg` (Apple Silicon). Instale o ffmpeg com `brew install ffmpeg`.
            **Linux:** `.deb` ou `.AppImage`; instale o `ffmpeg` pela sua distribuição.

            A CLI (`dub-cli-*`) está na mesma release para uso em scripts.
          draft: false
