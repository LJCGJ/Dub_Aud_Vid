name: Release

# Dispara ao criar uma tag v* (ex.: `git tag v0.1.0 && git push --tags`).
# Gera um zip por plataforma com: dub(.exe) + onnxruntime + espeak-ng-data +
# pasta py/ (engines Python opcionais) + README, e publica no GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: "1.20.1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: native-directml
            ort_asset: onnxruntime-win-x64-${ORT_VERSION}.zip
            ort_lib: lib/onnxruntime.dll
            exe: dub.exe
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ""
            ort_asset: onnxruntime-linux-x64-${ORT_VERSION}.tgz
            ort_lib: lib/libonnxruntime.so.${ORT_VERSION}
            exe: dub
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            features: native-metal
            ort_asset: onnxruntime-osx-arm64-${ORT_VERSION}.tgz
            ort_lib: lib/libonnxruntime.${ORT_VERSION}.dylib
            exe: dub
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: bash
        run: |
          FEAT="${{ matrix.features }}"
          if [ -n "$FEAT" ]; then
            cargo build --release -p dub-cli --target ${{ matrix.target }} --features "$FEAT"
          else
            cargo build --release -p dub-cli --target ${{ matrix.target }}
          fi

      - name: Baixar ONNX Runtime oficial
        shell: bash
        run: |
          set -e
          ASSET="${{ matrix.ort_asset }}"
          ASSET="${ASSET//\$\{ORT_VERSION\}/$ORT_VERSION}"
          URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ASSET}"
          echo "baixando $URL"
          curl -sSL -o ort_pkg "$URL"
          mkdir -p ort_extract
          case "$ASSET" in
            *.zip) unzip -q ort_pkg -d ort_extract ;;
            *.tgz) tar -xzf ort_pkg -C ort_extract ;;
          esac
          LIB="${{ matrix.ort_lib }}"
          LIB="${LIB//\$\{ORT_VERSION\}/$ORT_VERSION}"
          FOUND=$(find ort_extract -path "*/$LIB" | head -1)
          test -n "$FOUND" || { echo "lib não encontrada: $LIB"; find ort_extract -maxdepth 3; exit 1; }
          mkdir -p bundle
          # Nome genérico que o dub procura ao lado do executável.
          case "$FOUND" in
            *.dll)   cp "$FOUND" bundle/onnxruntime.dll ;;
            *.dylib) cp "$FOUND" bundle/libonnxruntime.dylib ;;
            *.so*)   cp "$FOUND" bundle/libonnxruntime.so ;;
          esac
          # Providers compartilhados (CUDA/DirectML carregam a partir dele), se existirem.
          find ort_extract -name "*providers_shared*" -exec cp {} bundle/ \; || true
          # DirectML.dll vem com o Windows 10 1903+; o pacote win-x64 padrão é CPU.
          # Para GPU no Windows, o usuário troca pela build Microsoft.ML.OnnxRuntime.DirectML (NuGet).

      - name: Obter espeak-ng-data (do pacote piper-tts)
        shell: bash
        run: |
          python -m pip install --quiet piper-tts
          DATA=$(python -c "import piper,os;print(os.path.join(os.path.dirname(piper.__file__),'espeak-ng-data'))")
          cp -r "$DATA" bundle/espeak-ng-data
          test -f bundle/espeak-ng-data/phontab

      - name: Montar pacote
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="dev-${GITHUB_SHA::7}"
          NAME="dub-${VERSION}-${{ matrix.name }}"
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} bundle/
          cp -r py bundle/py
          rm -rf bundle/py/.venv bundle/py/**/__pycache__ 2>/dev/null || true
          cp README.md LICENSE bundle/
          mkdir -p bundle/models/whisper bundle/models/voices bundle/models/translate
          cat > bundle/LEIA-ME.txt <<EOF
          dub ${VERSION} — ${{ matrix.name }}

          1. Baixe os modelos:   ./dub models download
             (ou copie manualmente para models/whisper, models/voices e models/translate)
          2. Verifique:          ./dub doctor
          3. Dublar:             ./dub video "URL ou arquivo.mp4"

          Engines Python (Kokoro, XTTS, Demucs, pyannote) são opcionais: veja py/README.md.
          GPU no Windows: substitua onnxruntime.dll pela build DirectML
          (pacote NuGet Microsoft.ML.OnnxRuntime.DirectML).
          EOF
          mv bundle "$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -r "${NAME}.zip" "$NAME" > /dev/null
          else
            tar -czf "${NAME}.tar.gz" "$NAME"
          fi
          ls -la *.zip *.tar.gz 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dub-*.zip
            dub-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
