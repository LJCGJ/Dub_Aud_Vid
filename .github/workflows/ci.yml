name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VULKAN_SDK_VERSION: "1.4.363.1"
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # whisper.cpp e espeak-ng são compilados via cmake; o cache evita refazer isso a cada push.
          shared-key: ${{ matrix.os }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências Python dos testes (engine mock)
        run: python -m pip install --quiet numpy

      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          # O espelho azure.archive.ubuntu.com dos runners às vezes trava por
          # dezenas de minutos; usa o espelho principal com timeout curto.
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          echo 'Acquire::http::Timeout "30"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99timeout >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Pasta de recursos do app (vazia no CI)
        shell: bash
        run: mkdir -p target/bundle-resources && touch target/bundle-resources/.keep

      # ffmpeg sem depender de actions de terceiros (que consultam a API do GitHub e
      # esbarram no limite de requisições): apt no Linux, brew no macOS, download
      # direto do build estático no Windows.
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          # Build estático do BtbN (GitHub): o apt dos runners às vezes leva 20+ min.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ff.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz"
          mkdir -p ff && tar -xJf ff.tar.xz -C ff
          echo "$(dirname "$(find ff -name ffmpeg -type f | head -1)")" >> "$GITHUB_PATH"

      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # BtbN às vezes responde HTML/429 em vez do zip: tenta de novo e, se
          # ainda falhar, usa o build do gyan.dev.
          fetch() { curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ff.zip "$1" && unzip -tq ff.zip >/dev/null; }
          fetch "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" \
            || fetch "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          unzip -q ff.zip -d ff
          echo "$(cygpath -w "$(dirname "$(find ff -name ffmpeg.exe | head -1)")")" >> "$GITHUB_PATH"

      - name: Verificar formatação
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes (bibliotecas e CLI)
        env:
          DUB_PYTHON: python
          RUST_LOG: info
        run: cargo test --workspace --exclude dub-app -- --nocapture

      - name: Build do app de desktop
        run: cargo build -p dub-app

      - name: Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        id: vulkan-cache-linux
        uses: actions/cache@v4
        with:
          path: ~/vulkan-sdk
          key: vulkan-sdk-linux-v2-${{ env.VULKAN_SDK_VERSION }}

      - name: Instalar Vulkan SDK (Linux)
        if: runner.os == 'Linux' && steps.vulkan-cache-linux.outputs.cache-hit != 'true'
        run: |
          # O Ubuntu 22.04 não tem glslc e os headers são antigos; o tarball da
          # LunarG (~350 MB) traz headers, loader e glslc. O pacote apt
          # 'vulkan-sdk' puxa Qt e leva 40 min — por isso o tarball.
          mkdir -p ~/vulkan-sdk && cd ~/vulkan-sdk
          curl -fsSL --retry 5 -o sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz"
          tar -xJf sdk.tar.xz --wildcards "*/x86_64/bin/glslc" "*/x86_64/include/*" "*/x86_64/lib/VulkanLoader/*" "*/x86_64/share/vulkan/*"
          rm sdk.tar.xz
          # Nesta versão o loader fica em lib/VulkanLoader/lib; o FindVulkan do
          # CMake procura em $VULKAN_SDK/lib.
          cp -a "${VULKAN_SDK_VERSION}/x86_64/lib/VulkanLoader/lib/." "${VULKAN_SDK_VERSION}/x86_64/lib/"

      - name: Variáveis do Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          SDK="$HOME/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64"
          echo "VULKAN_SDK=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$SDK/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          ls "$SDK/bin/glslc" "$SDK/include/vulkan/vulkan.h" "$SDK/lib/libvulkan.so"
          # O linker procura -lvulkan nos caminhos padrão; o whisper-rs-sys não
          # adiciona $VULKAN_SDK/lib no Linux.
          sudo cp -a "$SDK"/lib/libvulkan.so* /usr/local/lib/ && sudo ldconfig
          "$SDK/bin/glslc" --version | head -1

      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-windows-${{ env.VULKAN_SDK_VERSION }}

      - name: Instalar Vulkan SDK (Windows)
        if: runner.os == 'Windows' && steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Instalador oficial do LunarG em modo silencioso (mesmo método do CI do llama.cpp).
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/${env:VULKAN_SDK_VERSION}/windows/vulkan_sdk.exe" -OutFile vulkan_sdk.exe
          Start-Process -Wait -FilePath .\vulkan_sdk.exe -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install"
          Get-ChildItem C:\VulkanSDK | Select-Object Name

      - name: Variáveis do Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VULKAN_SDK=C:/VulkanSDK" >> "$GITHUB_ENV"
          echo "C:/VulkanSDK/Bin" >> "$GITHUB_PATH"
          ls C:/VulkanSDK/Include/vulkan/vulkan.h C:/VulkanSDK/Lib/vulkan-1.lib C:/VulkanSDK/Bin/glslc.exe

      - name: Build com backends de GPU da release (Windows)
        if: runner.os == 'Windows'
        run: cargo build -p dub-cli --features native-vulkan,native-directml

      - name: Build com backends de GPU da release (Linux)
        if: runner.os == 'Linux'
        run: cargo build -p dub-cli --features native-vulkan

      # O binário de debug já foi compilado por `cargo test`; reaproveitamos para não
      # pagar um segundo build completo (whisper.cpp + CTranslate2 + Tauri) em release.
      - name: Smoke test da CLI (pipeline com engines mock)
        shell: bash
        env:
          DUB_PYTHON: python
        run: |
          cargo build -p dub-cli
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i "testsrc=duration=6:size=320x240:rate=15" \
            -f lavfi -i "sine=frequency=440:duration=6" \
            -c:v libx264 -preset ultrafast -c:a aac -shortest smoke.mp4
          ./target/debug/dub doctor
          ./target/debug/dub video smoke.mp4 --mock --out smoke.dub.mp4 --work-dir smoke_work
          test -f smoke.dub.mp4 && test -f smoke_work/dub.srt

  python-only:
    name: build sem engines nativas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-only
      - run: cargo build -p dub-cli --no-default-features
