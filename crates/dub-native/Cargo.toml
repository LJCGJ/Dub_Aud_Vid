[package]
name = "dub-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Engines nativas (Rust + C++): time-stretch WSOLA, whisper.cpp, Piper via ONNX Runtime"
build = "build.rs"

[features]
default = ["whisper", "piper", "translate"]
# Transcrição com whisper.cpp (vendorizado pelo whisper-rs; compila com cmake).
whisper = ["dep:whisper-rs"]
# Aceleração do whisper.cpp — escolha UMA conforme a máquina de build.
whisper-cuda = ["whisper", "whisper-rs/cuda"]
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]
whisper-metal = ["whisper", "whisper-rs/metal"]
# Síntese Piper com ONNX Runtime carregado em tempo de execução (onnxruntime.dll/.so
# fica ao lado do executável; a build DirectML ou CUDA da lib dá GPU sem recompilar).
piper = ["dep:ort", "dep:espeak-rs-sys", "dep:unicode-normalization"]
# Execution providers do ONNX Runtime (exigem a build correspondente da onnxruntime.dll).
ort-cuda = ["piper", "ort/cuda"]
ort-directml = ["piper", "ort/directml"]
# Tradução com CTranslate2 (compila a lib C++; ~5 min na primeira vez).
translate = ["dep:ct2rs"]
ct2-cuda = ["translate", "ct2rs/cuda"]

[dependencies]
dub-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
cxx = "1"
whisper-rs = { version = "0.14", optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"], optional = true }
espeak-rs-sys = { version = "0.2", optional = true }
unicode-normalization = { version = "0.1", optional = true }
ct2rs = { version = "0.10", default-features = false, features = ["ruy", "sentencepiece"], optional = true }

[build-dependencies]
cxx-build = "1"
