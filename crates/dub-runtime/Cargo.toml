[package]
name = "dub-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Camada compartilhada entre CLI e app: resolução de engines (nativa → Python), execução de jobs com progresso, diagnóstico"

[features]
default = ["native"]
native = ["dep:dub-native"]
native-cuda = ["native", "dub-native/whisper-cuda", "dub-native/ort-cuda", "dub-native/ct2-cuda"]
native-vulkan = ["native", "dub-native/whisper-vulkan"]
native-directml = ["native", "dub-native/ort-directml"]
native-metal = ["native", "dub-native/whisper-metal"]

[dependencies]
dub-core.workspace = true
dub-media.workspace = true
dub-engines-py.workspace = true
dub-input-video.workspace = true
dub-models.workspace = true
dub-native = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }
