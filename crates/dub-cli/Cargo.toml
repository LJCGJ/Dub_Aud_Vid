[package]
name = "dub-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Linha de comando do dub"

build = "build.rs"

[[bin]]
name = "dub"
path = "src/main.rs"

[features]
default = ["native"]
# Engines nativas (whisper.cpp, Piper/ONNX Runtime, WSOLA em C++). Exige cmake e um
# compilador C++. Desligue com --no-default-features para um build só-Python.
native = ["dub-runtime/native"]
native-cuda = ["dub-runtime/native-cuda"]
native-vulkan = ["dub-runtime/native-vulkan"]
native-directml = ["dub-runtime/native-directml"]
native-metal = ["dub-runtime/native-metal"]

[dependencies]
dub-core.workspace = true
dub-runtime = { workspace = true, default-features = false }
dub-models.workspace = true
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
