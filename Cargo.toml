[workspace]
resolver = "2"
members = [
    "crates/dub-core",
    "crates/dub-media",
    "crates/dub-engines-py",
    "crates/dub-input-video",
    "crates/dub-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Leonardo Gonzaga"]
license = "MIT"
repository = "https://github.com/LJCGJ/Dub_Aud_Vid"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
hound = "3.5"
tempfile = "3"
which = "7"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
uuid = { version = "1", features = ["v4"] }

dub-core = { path = "crates/dub-core" }
dub-media = { path = "crates/dub-media" }
dub-engines-py = { path = "crates/dub-engines-py" }
dub-input-video = { path = "crates/dub-input-video" }

[profile.release]
lto = "thin"
codegen-units = 1
